# Database Configuration
db.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BankingDB;encrypt=true;trustServerCertificate=true}
db.username=${DB_USERNAME:sa}
db.password=${DB_PASSWORD:YourStrongPassword123!}

# JWT Configuration
jwt.secret=${JWT_SECRET:banking-application-super-secret-key-that-should-be-at-least-32-characters-long}
jwt.accessExpiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:86400000}

# Server Configuration
server.port=${SERVER_PORT:8080}

# OAuth 2.0 Configuration
oauth.clientId=${OAUTH_CLIENT_ID:banking-client}
oauth.clientSecret=${OAUTH_CLIENT_SECRET:client-secret-key}
